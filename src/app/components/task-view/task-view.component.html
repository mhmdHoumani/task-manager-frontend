<div class="space-y-6">
  <!-- Task Title -->
  <div>
    <h3 class="text-2xl font-semibold text-gray-900 mb-2">{{ task.title }}</h3>
    
    <!-- Category and Status Badges -->
    <div class="flex items-center space-x-3">
      <span class="inline-flex items-center rounded-full px-3 py-1 text-sm font-medium"
            [class]="getCategoryColor(task.category)">
        {{ task.category }}
      </span>
      
      <span class="inline-flex items-center rounded-full px-3 py-1 text-sm font-medium"
            [class]="getStatusColor()">
        {{ getStatusText() }}
      </span>
    </div>
  </div>

  <!-- Task Details -->
  <div class="space-y-4">
    <!-- Description -->
    <div>
      <h4 class="text-sm font-medium text-gray-700 mb-2">Description</h4>
      <div class="rounded-md bg-gray-50 p-3">
        <p *ngIf="task.description" class="text-gray-900">{{ task.description }}</p>
        <p *ngIf="!task.description" class="text-gray-500 italic">No description provided</p>
      </div>
    </div>

    <!-- Created Date -->
    <div>
      <h4 class="text-sm font-medium text-gray-700 mb-2">Created</h4>
      <div class="rounded-md bg-gray-50 p-3">
        <p class="text-gray-900">{{ task.createdAt | date:'full' }}</p>
      </div>
    </div>

    <!-- Task ID (for developers/debugging) -->
    <!-- <div>
      <h4 class="text-sm font-medium text-gray-700 mb-2">Task ID</h4>
      <div class="rounded-md bg-gray-50 p-3">
        <p class="font-mono text-xs text-gray-600">{{ task._id }}</p>
      </div>
    </div> -->
  </div>

  <!-- Task Stats -->
  <div class="rounded-lg bg-blue-50 p-4">
    <h4 class="text-sm font-medium text-blue-900 mb-2">Quick Stats</h4>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div>
        <span class="text-blue-700">Status:</span>
        <span class="ml-2 font-medium text-blue-900">{{ getStatusText() }}</span>
      </div>
      <div>
        <span class="text-blue-700">Category:</span>
        <span class="ml-2 font-medium text-blue-900">{{ task.category }}</span>
      </div>
    </div>
  </div>
</div>
