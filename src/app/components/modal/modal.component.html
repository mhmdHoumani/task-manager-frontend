<!-- Modal Backdrop -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4"
  (click)="onBackdropClick($event)"
>
  <!-- Modal Container -->
  <div
    class="relative w-full transform rounded-lg bg-white shadow-xl transition-all"
    [class.max-w-sm]="size === 'sm'"
    [class.max-w-md]="size === 'md'"
    [class.max-w-lg]="size === 'lg'"
    [class.max-w-2xl]="size === 'xl'"
    (click)="onModalClick($event)"
  >
    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b px-6 py-4">
      <h3 class="text-lg font-semibold text-gray-900">{{ title }}</h3>
      <button
        (click)="onClose()"
        class="rounded-full p-1 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600"
      >
        <lucide-icon [img]="X" class="h-5 w-5"></lucide-icon>
      </button>
    </div>

    <!-- Modal Content -->
    <div class="p-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
