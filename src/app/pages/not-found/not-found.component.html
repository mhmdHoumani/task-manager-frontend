<div class="flex flex-1 bg-gray-50 py-12">
  <div class="mx-auto max-w-md text-center">
    <!-- 404 Illustration -->
    <div class="mb-8">
      <div class="mb-4 text-9xl font-bold text-blue-600">404</div>
      <lucide-icon [img]="Search" class="mx-auto h-16 w-16 text-gray-400"></lucide-icon>
    </div>

    <!-- Error Message -->
    <h1 class="mb-4 text-3xl font-bold text-gray-900">Page Not Found</h1>
    <p class="mb-8 text-gray-600">
      Sorry, we couldn't find the page you're looking for. It might have been moved, deleted, or you
      entered the wrong URL.
    </p>

    <!-- Action Buttons -->
    <div class="space-y-4">
      <a
        routerLink="/"
        class="inline-flex items-center rounded-lg bg-blue-600 px-6 py-3 font-medium text-white transition-colors hover:bg-blue-700"
      >
        <lucide-icon [img]="Home" class="mr-2 h-5 w-5"></lucide-icon>
        Go to Home
      </a>

      <div class="text-center">
        <button
          (click)="goBack()"
          class="inline-flex items-center font-medium text-blue-600 hover:text-blue-700"
        >
          <lucide-icon [img]="ArrowLeft" class="mr-1 h-4 w-4"></lucide-icon>
          Go Back
        </button>
      </div>
    </div>

    <!-- Helpful Links -->
    <!-- <div class="mt-12 border-t border-gray-200 pt-8">
      <p class="mb-4 text-sm text-gray-500">You might be looking for:</p>
      <div class="space-x-4">
        <a routerLink="/tasks" class="text-sm font-medium text-blue-600 hover:text-blue-700"
          >Tasks</a
        >
        <a routerLink="/about" class="text-sm font-medium text-blue-600 hover:text-blue-700"
          >About</a
        >
      </div>
    </div> -->
  </div>
</div>
