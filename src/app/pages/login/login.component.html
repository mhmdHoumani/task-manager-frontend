<div
  class="flex min-h-screen items-center justify-center bg-gradient-to-br from-blue-600 to-purple-700 px-4"
>
  <div class="w-full max-w-md space-y-8">
    <!-- Header -->
    <div class="text-center">
      <h2 class="mb-2 text-3xl font-bold text-white">Welcome Back</h2>
      <p class="text-blue-100">Sign in to your account</p>
    </div>

    <!-- Login Form -->
    <div class="rounded-lg bg-white p-8 shadow-xl">
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Email Field -->
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-gray-700">
            Email Address
          </label>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <lucide-icon [img]="Mail" class="h-5 w-5 text-gray-400"></lucide-icon>
            </div>
            <input
              id="email"
              [(ngModel)]="loginForm.email"
              name="email"
              type="email"
              required
              class="block w-full rounded-md border border-gray-300 py-2 pl-10 pr-3 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter your email"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="mb-2 block text-sm font-medium text-gray-700">
            Password
          </label>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <lucide-icon [img]="Lock" class="h-5 w-5 text-gray-400"></lucide-icon>
            </div>
            <input
              id="password"
              [(ngModel)]="loginForm.password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              required
              class="block w-full rounded-md border border-gray-300 py-2 pl-10 pr-10 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter your password"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 flex items-center pr-3"
            >
              <lucide-icon
                [img]="showPassword ? EyeOff : Eye"
                class="h-5 w-5 text-gray-400 hover:text-gray-600"
              ></lucide-icon>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="rounded-md border border-red-200 bg-red-50 p-3">
          <p class="text-sm text-red-600">{{ errorMessage }}</p>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading || !isValidForm()"
          class="flex w-full justify-center rounded-md border border-transparent bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:bg-gray-400"
        >
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="flex items-center">
            <svg
              class="-ml-1 mr-3 h-5 w-5 animate-spin text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            Signing in...
          </span>
        </button>
      </form>

      <!-- Sign Up Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Don't have an account?
          <a routerLink="/signup" class="font-medium text-blue-600 hover:text-blue-500">
            Sign up here
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
